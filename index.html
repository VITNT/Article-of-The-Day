<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article of The Day</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/x-icon" href="./images/favicon.png" />
  </head>
  <body>
    <div class="header">
      <img src="./images/github-logo.png" alt="github-logo" />
      <a
        class="header-github"
        href="https://github.com/VITNT/Article-of-The-Day"
        target="_blank"
      >
        Source Code
      </a>
    </div>
    <div class="hero">
      <div class="hero-top">
        <h1>An Article a Day.</h1>
      </div>
      <button class="normal-btn" id="article-button">
        Check Today's Article
      </button>
      <p id="open-options" class="open-options">Not Satisfied?</p>
      <div id="options" class="options">
        <!-- <p>Shuffle A New Pick</p> -->
        <div id="category-selector" class="categories">
          <button class="selector-btn active" data-category="all">All</button>
          <button class="selector-btn" data-category="general">General</button>
          <button class="selector-btn" data-category="tech">Tech</button>
          <button class="selector-btn" data-category="science">Science</button>
          <button class="selector-btn" data-category="sports">Sports</button>
          <button class="selector-btn" data-category="economics">
            Economics
          </button>
        </div>
      </div>
      <div class="article-container">
        <div class="top">
          <p id="article-source"></p>
          <p id="date"></p>
        </div>
        <h1 id="article-title"></h1>
        <p id="article-text"></p>
        <div class="open-buttons">
          <button class="normal-btn" id="open-article">Open Article</button>
          <button class="normal-btn" id="open-source">Open Source</button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
