<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article of The Day</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/x-icon" href="favicon.png";
  </head>
  <body>
    <div class="hero">
      <div class="hero-top">
        <h1>An Article a Day keeps the Doctor Away.</h1>
      </div>
      <button id="article-button">Check Today's Article</button>

      <div class="article-container">
        <div class="top">
          <p id="article-source"></p>
          <p id="date"></p>
        </div>
        <h1 id="article-title"></h1>
        <p id="article-text"></p>
        <button id="open-article">Open Article</button>
      </div>

    </div>
    <script src="./script.js"></script>
  </body>
</html>
